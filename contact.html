<!DOCTYPE html>
<html>

<head>
    <title>Contact</title>
</head>

<body>

    <h1>📝 Contact & Registration</h1>

    <hr>

    <nav>
        <a href="index.html">Home</a> |
        <a href="resources.html">Resources</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <hr>

    <form id="contactForm">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="g" id="male">
        <label for="male">Male</label>

        <input type="radio" name="g" id="female">
        <label for="female">Female</label>

        <br><br>

        <label for="subject">Favourite Subject:</label><br>
        <select id="subject">
            <option>Mathematics</option>
            <option>English</option>
            <option>Science</option>
            <option>Computer Studies</option>
        </select>

        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Register">

    </form>

    <footer>
        <hr>
        <p>©️ 2026 Student Study Hub</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
